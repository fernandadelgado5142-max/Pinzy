
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinzy</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f5ff;color:#30263b}
header{background:#8b5cf6;color:white;padding:20px;text-align:center}
header h1{margin:0}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;background:white;position:sticky;top:0;z-index:5}
button{border:0;border-radius:10px;padding:11px 15px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
nav button{white-space:nowrap}
main{max-width:850px;margin:auto;padding:16px}
.page{display:none}
.page.active{display:block}
.panel,.post{background:white;padding:16px;border-radius:15px;margin-bottom:16px;box-shadow:0 2px 10px #0000000d}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font:inherit}
textarea{min-height:75px}
.post img{width:100%;max-height:600px;object-fit:contain;border-radius:10px;background:#eee}
.post small{color:#777}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions button{padding:9px 12px}
.muted{color:#777}
#userInfo{font-size:14px;text-align:center;padding:10px}
#preview{max-width:100%;max-height:250px;display:none;margin:10px auto}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>

<body>

<header>
<h1>💜 Pinzy</h1>
<p>Compartilhe suas ideias e inspirações</p>
</header>

<div id="userInfo">Você não está conectado.</div>

<nav>
<button data-page="home">Início</button>
<button data-page="explore">Explorar</button>
<button data-page="favorites">Favoritos</button>
<button data-page="publish">Publicar</button>
<button data-page="profile">Perfil</button>
<button data-page="admin">Admin</button>
</nav>

<main>

<section id="home" class="page active">
<h2>Início</h2>
<div id="homePosts">Carregando publicações...</div>
</section>

<section id="explore" class="page">
<h2>Explorar</h2>
<input id="search" placeholder="Pesquisar publicações..." />
<div id="explorePosts"></div>
</section>

<section id="favorites" class="page">
<h2>❤️ Meus favoritos</h2>
<div id="favoritePosts"></div>
</section>

<section id="publish" class="page">
<h2>Publicar uma foto</h2>
<div class="panel">
<label>Escolha uma imagem</label>
<input type="file" id="photoFile" accept="image/*">
<img id="preview" alt="Prévia da imagem">
<textarea id="description" placeholder="Escreva uma descrição..."></textarea>
<input id="category" placeholder="Categoria (ex: tatuagem, desenho...)">
<button id="publishButton">Publicar foto</button>
<p id="uploadStatus" class="muted"></p>
</div>
</section>

<section id="profile" class="page">
<h2>Minha conta</h2>
<div class="panel">
<input id="email" type="email" placeholder="Seu e-mail">
<input id="password" type="password" placeholder="Sua senha">
<button id="registerButton">Criar conta</button>
<button id="loginButton">Entrar</button>
<button id="googleButton">Entrar com Google</button>
<button id="logoutButton">Sair da conta</button>
<p id="authStatus" class="muted"></p>
</div>
</section>

<section id="admin" class="page">
<h2>⚙️ Administração</h2>
<div class="panel">
<p id="adminStatus">Área administrativa.</p>
<div id="adminPosts"></div>
</div>
</section>

</main>

<footer>Pinzy 💜</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getFirestore,
 collection,
 addDoc,
 onSnapshot,
 query,
 orderBy,
 serverTimestamp,
 doc,
 updateDoc,
 arrayUnion,
 arrayRemove,
 deleteDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
 getStorage,
 ref,
 uploadBytes,
 getDownloadURL,
 deleteObject
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

// COLOQUE A CONFIGURAÇÃO DO SEU FIREBASE AQUI
const firebaseConfig = {
 apiKey: "COLOQUE_SUA_API_KEY",
 authDomain: "COLOQUE_SEU_AUTH_DOMAIN",
 projectId: "COLOQUE_SEU_PROJECT_ID",
 storageBucket: "COLOQUE_SEU_STORAGE_BUCKET",
 messagingSenderId: "COLOQUE_SEU_SENDER_ID",
 appId: "COLOQUE_SEU_APP_ID"
};

// COLOQUE SEU E-MAIL DE ADMINISTRADOR AQUI
const ADMIN_EMAIL = "SEU_EMAIL@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const googleProvider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);

let currentUser = null;
let allPosts = [];

function isAdmin(){
 return currentUser &&
 currentUser.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

// NAVEGAÇÃO
document.querySelectorAll("[data-page]").forEach(button=>{
 button.addEventListener("click",()=>{
  const page = button.dataset.page;

  if(page === "admin" && !isAdmin()){
   alert("Área exclusiva do administrador.");
   return;
  }

  document.querySelectorAll(".page").forEach(section=>{
   section.classList.remove("active");
  });

  $(page).classList.add("active");

  if(page === "favorites") renderFavorites();
  if(page === "admin") renderAdmin();
  if(page === "explore") renderPosts();
 });
});

// CADASTRO
$("registerButton").onclick = async ()=>{
 try{
  await createUserWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );
  $("authStatus").textContent = "Conta criada!";
 }catch(error){
  $("authStatus").textContent = error.message;
 }
};

// LOGIN
$("loginButton").onclick = async ()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );
  $("authStatus").textContent = "Login realizado!";
 }catch(error){
  $("authStatus").textContent = error.message;
 }
};

// LOGIN GOOGLE
$("googleButton").onclick = async ()=>{
 try{
  await signInWithPopup(auth,googleProvider);
 }catch(error){
  $("authStatus").textContent = error.message;
 }
};

// SAIR
$("logoutButton").onclick = async ()=>{
 try{
  await signOut(auth);
 }catch(error){
  alert(error.message);
 }
};

// ESTADO DA CONTA
onAuthStateChanged(auth,user=>{
 currentUser = user;

 $("userInfo").textContent = user
  ? "Conectado: " + user.email
  : "Você não está conectado.";

 $("logoutButton").style.display = user ? "inline-block" : "none";

 renderPosts();
 renderFavorites();
});

// PRÉVIA DA FOTO
$("photoFile").addEventListener("change",()=>{
 const file = $("photoFile").files[0];

 if(!file){
  $("preview").style.display = "none";
  return;
 }

 $("preview").src = URL.createObjectURL(file);
 $("preview").style.display = "block";
});

// PUBLICAR FOTO
$("publishButton").onclick = async ()=>{
 if(!currentUser){
  alert("Entre na sua conta primeiro.");
  return;
 }

 const file = $("photoFile").files[0];
 const description = $("description").value.trim();
 const category = $("category").value.trim();

 if(!file){
  alert("Escolha uma foto.");
  return;
 }

 if(!file.type.startsWith("image/")){
  alert("Escolha um arquivo de imagem.");
  return;
 }

 if(file.size > 10 * 1024 * 1024){
  alert("A imagem deve ter até 10 MB.");
  return;
 }

 $("publishButton").disabled = true;
 $("uploadStatus").textContent = "Enviando foto...";

 try{
  const fileName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const imageRef = ref(storage,"posts/" + currentUser.uid + "/" + fileName);

  await uploadBytes(imageRef,file);
  const imageURL = await getDownloadURL(imageRef);

  await addDoc(collection(db,"posts"),{
   imageURL,
   storagePath: imageRef.fullPath,
   description,
   category,
   userId: currentUser.uid,
   userEmail: currentUser.email,
   likedBy: [],
   createdAt: serverTimestamp()
  });

  $("description").value = "";
  $("category").value = "";
  $("photoFile").value = "";
  $("preview").style.display = "none";
  $("uploadStatus").textContent = "Foto publicada com sucesso!";

 }catch(error){
  $("uploadStatus").textContent = "Erro: " + error.message;
 }finally{
  $("publishButton").disabled = false;
 }
};

// CARREGAR PUBLICAÇÕES
const postsQuery = query(
 collection(db,"posts"),
 orderBy("createdAt","desc")
);

onSnapshot(postsQuery,snapshot=>{
 allPosts = snapshot.docs.map(item=>({
  id:item.id,
  ...item.data()
 }));

 renderPosts();
 renderFavorites();
 if(isAdmin()) renderAdmin();

},error=>{
 $("homePosts").textContent = "Erro ao carregar: " + error.message;
});

// CRIAR CARTÃO
function createPostCard(post){
 const article = document.createElement("article");
 article.className = "post";

 const image = document.createElement("img");
 image.src = post.imageURL;
 image.alt = post.description || "Publicação";
 image.loading = "lazy";

 const description = document.createElement("p");
 description.textContent = post.description || "";

 const category = document.createElement("small");
 category.textContent = "Categoria: " + (post.category || "Geral");

 const author = document.createElement("p");
 author.className = "muted";
 author.textContent = "Publicado por: " + (post.userEmail || "Usuário");

 const actions = document.createElement("div");
 actions.className = "actions";

 const likeButton = document.createElement("button");
 const liked = currentUser &&
 (post.likedBy || []).includes(currentUser.uid);

 likeButton.textContent = (liked ? "❤️" : "🤍") +
  " Curtir (" + (post.likedBy || []).length + ")";

 likeButton.onclick = ()=>toggleLike(post.id);

 actions.append(likeButton);
 article.append(image,description,category,author,actions);

 return article;
}

// RENDERIZAR INÍCIO E EXPLORAR
function renderPosts(){
 const home = $("homePosts");
 const explore = $("explorePosts");

 if(!home || !explore) return;

 home.replaceChildren();
 explore.replaceChildren();

 const search = ($("search").value || "").toLowerCase();

 const filtered = allPosts.filter(post=>{
  const text = (
   (post.description || "") + " " +
   (post.category || "") + " " +
   (post.userEmail || "")
  ).toLowerCase();

  return text.includes(search);
 });

 if(filtered.length === 0){
  home.textContent = "Ainda não há publicações.";
  explore.textContent = "Nenhuma publicação encontrada.";
  return;
 }

 filtered.forEach(post=>{
  home.appendChild(createPostCard(post));
  explore.appendChild(createPostCard(post));
 });
}

$("search").addEventListener("input",renderPosts);

// CURTIR
async function toggleLike(postId){
 if(!currentUser){
  alert("Entre na sua conta para curtir.");
  return;
 }

 const post = allPosts.find(item=>item.id === postId);
 if(!post) return;

 const liked = (post.likedBy || []).includes(currentUser.uid);

 try{
  await updateDoc(doc(db,"posts",postId),{
   likedBy: liked
    ? arrayRemove(currentUser.uid)
    : arrayUnion(currentUser.uid)
  });
 }catch(error){
  alert("Não foi possível curtir: " + error.message);
 }
}

// FAVORITOS
function renderFavorites(){
 const container = $("favoritePosts");
 if(!container) return;

 container.replaceChildren();

 if(!currentUser){
  container.textContent = "Entre na sua conta para ver seus favoritos.";
  return;
 }

 const favorites = allPosts.filter(post=>
  (post.likedBy || []).includes(currentUser.uid)
 );

 if(favorites.length === 0){
  container.textContent = "Você ainda não tem favoritos.";
  return;
 }

 favorites.forEach(post=>{
  container.appendChild(createPostCard(post));
 });
}

// ADMINISTRAÇÃO
function renderAdmin(){
 const container = $("adminPosts");
 container.replaceChildren();

 if(!isAdmin()){
  $("adminStatus").textContent = "Acesso não autorizado.";
  return;
 }

 $("adminStatus").textContent =
  "Painel administrativo. Publicações: " + allPosts.length;

 allPosts.forEach(post=>{
  const item = document.createElement("div");
  item.className = "panel";

  const description = document.createElement("p");
  description.textContent = post.description || "Sem descrição";

  const author = document.createElement("small");
  author.textContent = post.userEmail || "Usuário";

  const removeButton = document.createElement("button");
  removeButton.textContent = "Excluir publicação";

  removeButton.onclick = async ()=>{
   if(!confirm("Deseja excluir esta publicação?")) return;

   try{
    await deleteDoc(doc(db,"posts",post.id));

    if(post.storagePath){
     try{
      await deleteObject(ref(storage,post.storagePath));
     }catch(error){
      console.warn("Arquivo não encontrado:",error);
     }
    }

   }catch(error){
    alert("Erro ao excluir: " + error.message);
   }
  };

  item.append(description,author,removeButton);
  container.appendChild(item);
 });
}

</script>
</body>
</html>
