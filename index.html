<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinzy</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7ff;color:#172554}
header{background:white;padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px #dbeafe}
.logo{font-size:25px;font-weight:bold;color:#1769ff;display:flex;align-items:center;gap:7px}
#perfil{width:40px;height:40px;border-radius:50%;object-fit:cover;display:none}
input{padding:12px;border:0;border-radius:22px;background:#eef3ff;font-size:14px}
#busca{flex:1;min-width:120px}
button{padding:11px;border:0;border-radius:22px;background:#1769ff;color:white;font-weight:bold}
main{padding:14px}
#galeria{columns:2;column-gap:10px}
.card{display:inline-block;width:100%;break-inside:avoid;margin-bottom:12px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #dbeafe}
.card img{width:100%;display:block}
.info{padding:9px}
.info p{font-weight:bold}
.curtir{background:#e8efff;color:#1769ff}
footer{text-align:center;padding:20px;color:#64748b}
@media(min-width:700px){#galeria{columns:4}}
</style>
</head>
<body>

<header>
<div class="logo">
<img id="perfil" alt="Perfil">
<span>💙 Pinzy</span>
</div>

<input id="busca" placeholder="🔍 Buscar..." oninput="filtrar()">

<button onclick="document.getElementById('trocar').click()">Trocar foto</button>
<input id="trocar" type="file" accept="image/*" hidden>

<button onclick="document.getElementById('arquivo').click()">+ Publicar</button>
<input id="arquivo" type="file" accept="image/*" multiple hidden>
</header>

<main>
<h2>Sua inspiração. Seu mundo. ✨</h2>
<p>Descubra ideias e encontre inspiração!</p>
<div id="galeria"></div>
<p id="vazio" hidden>Nenhuma foto encontrada.</p>
</main>

<footer>Feito com 💙 por Pinzy</footer>

<script>
const fotos=[
["Natureza","photo-1470252649378-9c29740c9fa8"],
["Praia","photo-1507525428034-b723cf961d3e"],
["Flores","photo-1490750967868-88aa4486c946"],
["Montanhas","photo-1464822759023-fed622ff2c3b"],
["Moda","photo-1483985988355-763728e1935b"],
["Café","photo-1445116572660-236099ec97a0"],
["Paisagem","photo-1470770841072-f978cf4d019e"],
["Arquitetura","photo-1487958449943-2429e8be8625"],
["Gatos","photo-1514888286974-6c03e2ca1dba"],
["Decoração","photo-1616486338812-3dadae4b4ace"],
["Comida","photo-1540189549336-e6e99c3679fe"],
["Cachorro","photo-1552053831-71594a27632d"]
];

const galeria=document.getElementById("galeria");

function adicionarFoto(url,nome){
const card=document.createElement("article");
card.className="card";
card.dataset.nome=nome.toLowerCase();

const img=document.createElement("img");
img.src=url;
img.alt=nome;
img.loading="lazy";
img.onerror=()=>card.remove();

const info=document.createElement("div");
info.className="info";

const titulo=document.createElement("p");
titulo.textContent=nome;

const curtir=document.createElement("button");
curtir.className="curtir";
curtir.textContent="♡ Curtir";
curtir.onclick=()=>{
curtir.textContent=curtir.textContent==="♡ Curtir"?"♥ Curtido":"♡ Curtir";
};

info.append(titulo,curtir);
card.append(img,info);
galeria.append(card);
}

fotos.forEach(f=>{
adicionarFoto(
"https://images.unsplash.com/"+f[1]+"?auto=format&fit=crop&w=500&q=70",
f[0]
);
});

function filtrar(){
const busca=document.getElementById("busca").value.toLowerCase();
document.querySelectorAll(".card").forEach(card=>{
card.style.display=card.dataset.nome.includes(busca)?"inline-block":"none";
});
const cards=[...document.querySelectorAll(".card")];
document.getElementById("vazio").hidden=
cards.some(c=>c.style.display!=="none");
}

document.getElementById("trocar").onchange=e=>{
const arquivo=e.target.files[0];
if(!arquivo)return;
const leitor=new FileReader();
leitor.onload=()=>{
const perfil=document.getElementById("perfil");
perfil.src=leitor.result;
perfil.style.display="block";
try{localStorage.setItem("pinzyPerfil",leitor.result)}catch(err){}
};
leitor.readAsDataURL(arquivo);
};

try{
const salvo=localStorage.getItem("pinzyPerfil");
if(salvo){
document.getElementById("perfil").src=salvo;
document.getElementById("perfil").style.display="block";
}
}catch(e){}

document.getElementById("arquivo").onchange=e=>{
Array.from(e.target.files).forEach(arquivo=>{
if(!arquivo.type.startsWith("image/"))return;
const leitor=new FileReader();
leitor.onload=()=>adicionarFoto(leitor.result,arquivo.name);
leitor.readAsDataURL(arquivo);
});
e.target.value="";
};
</script>
</body>
</html>
